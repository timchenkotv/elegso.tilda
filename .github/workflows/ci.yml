name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    runs-on: [self-hosted, Linux, X64, wlab-ci, elegso-site-ci]
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
      - name: Run site regression suites
        run: |
          node --version
          python3 --version
          node --test tests/*.test.mjs tests/test_contact_popups.mjs
          python3 -m unittest discover -s tests -p 'test_*.py'
          git diff --check
