server {
    listen 127.0.0.1:8943 ssl;
    http2 on;
    server_name site.elegso.ru elegso.ru;

    ssl_certificate /etc/letsencrypt/live/site.elegso.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/site.elegso.ru/privkey.pem;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    location / {
        proxy_pass http://172.16.8.40:80;
    }
}
