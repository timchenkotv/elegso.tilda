server {
    listen 80;
    listen [::]:80;
    server_name site.elegso.ru elegso.ru www.elegso.ru;

    root /srv/www/elegso.ru/current/www;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/elegso.access.log;
    error_log  /var/log/nginx/elegso.error.log;

    server_tokens off;
    etag on;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;

    location /api/calc/ {
        client_max_body_size 2m;
        proxy_pass http://127.0.0.1:8783/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /calculator-data/ {
        client_max_body_size 2m;
        proxy_pass http://127.0.0.1:8783/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri/index.html $uri.html $uri =404;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|webp|avif|svg|ico|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
        access_log off;
    }

    error_page 404 /error404/index.html;
}
