server {
    listen 80;
    listen [::]:80;
    server_name elegso.ru www.elegso.ru;

    root /srv/www/elegso.ru/current/www;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/elegso.access.log;
    error_log  /var/log/nginx/elegso.error.log;

    server_tokens off;
    etag on;

    set $elegso_robots "index, follow, max-image-preview:large";
    if ($uri ~ ^/(?:header|footer|error404)(?:/|$)) {
        set $elegso_robots "noindex, nofollow, noarchive";
    }
    if ($uri ~ ^/page(?:28912341|28912345|32088114|52312037)\.html$) {
        set $elegso_robots "noindex, nofollow, noarchive";
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header X-Robots-Tag $elegso_robots always;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;

    if ($host = www.elegso.ru) {
        return 301 https://elegso.ru$request_uri;
    }

    location = /robots.txt {
        default_type text/plain;
        try_files /robots.production.txt =404;
    }

    location = /sitemap.xml {
        default_type application/xml;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files /sitemap.xml =404;
    }

    location /api/calc/ {
        client_max_body_size 2m;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:8783/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /calculator-data/ {
        client_max_body_size 2m;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:8783/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Keep the calculator service under the calculator page. Privacy filters
    # sometimes block generic API-looking paths before they reach nginx.
    location /calc_nst/service/ {
        client_max_body_size 2m;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:8783/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri/index.html $uri.html $uri =404;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|webp|avif|svg|ico|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
        access_log off;
    }

    error_page 404 /error404/index.html;
}
