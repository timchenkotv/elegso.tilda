# Every entry below is backed by a historical Tilda URL, page ID, product ID,
# sitemap or production-log observation. Keep the readable source inventory in
# ops/nginx/legacy-redirects.json and verify it with the live redirect audit.
map $uri $elegso_legacy_target {
    default "";

    # Retired general/company pages with no direct modern service equivalent.
    ~^/(?:1111111|a|accounting_services|accounting_services_|c|data|footer|header|it-autsorsing|lawyer|legal_assistance_for_business|legal_assistance_for_self_employed|legal_assistance_to_citizens|price)/?$ /;

    ~^/(?:a_class_action_lawsuit|judicial_penalties)/?$ /judicial_protection/;
    ~^/arbitr/?$ /arbitration_lawyer/;
    ~^/(?:dispute_the_debt|dolg)/?$ /collect_the_debt/;
    ~^/(?:loan_lowyer|lost_profit)/?$ /property_law/;
    ~^/(?:objection_to_a_court_order|restoration_of_the_terms_of_the_court_order)/?$ /cancellation_of_the_court_order/;
    ~^/obzhalovanie/?$ /appeal_of_judicial_acts/;
    ~^/for_contractor/?$ /offer_for_lawyer_20231103/;
    ~^/privacy-policy/?$ /soglashenie/;
    ~^/representation_of_interests_in_court/?$ /representation_in_the_arbitration_court/;
    ~^/changing_the_terms_of_the_lease_agreement/?$ /contract_modification/;
    ~^/(?:assistance_in_early_termination_of_the_lease_agreement|refund_of_lease_payments)/?$ /termination_of_the_lease_agreement/;
    ~^/return_of_the_balance_of_counter_obligations_under_the_lease_agreement/?$ /calculator_of_the_balance_of_counter_obligations_in_leasing/;
    ~^/urist_po_dtp/?$ /accident_lawyer/;

    ~^/(?:assistance_in_case_of_late_lease_payments|consulting_on_leasing_disputes|invitation_to_a_class_action_lawsuit_against_ooo_alfamobil|invitation_to_a_class_action_lawsuit_against_ooo_gazprombank_avtolizing|invitation_to_a_class_action_lawsuit_against_ooo_sespel_finans|leasing|leasing_|legal_advice_in_case_of_withdrawal_of_the_leased_item|legal_advice_on_the_lease_agreement|lising|lising_|lising_gaponenko_s_v|lizing|recognition_of_the_lease_agreement_as_redeemable|representation_of_interests_in_court_under_a_leasing_agreement|the_code_of_laws_on_leasing)/?$ /leasing_lawyer/;

    # Direct Tilda pageNNNN.html URLs, including IDs from retired versions.
    ~^/page(?:8197735|26581741|27160048|28266689|28664486|28879571|28912032|28912236|28912244|28912341|28912345|31927610|32097304|36648233|36945165|40007090|40725663)(?:\.html)?/?$ /;
    ~^/page(?:28127140|41375130)(?:\.html)?/?$ /arbitration_lawyer/;
    ~^/page(?:28912241|28912248|27136769|31916100)(?:\.html)?/?$ /collect_the_debt/;
    ~^/page(?:28912252|32095051|72175857)(?:\.html)?/?$ /property_law/;
    ~^/page(?:40727557|40760954|40761190)(?:\.html)?/?$ /cancellation_of_the_court_order/;
    ~^/page(?:32088114|72328619)(?:\.html)?/?$ /representation_in_the_arbitration_court/;
    ~^/page(?:28913458|32108608)(?:\.html)?/?$ /contract_modification/;
    ~^/page(?:28913541|28900677|71460265)(?:\.html)?/?$ /termination_of_the_lease_agreement/;
    ~^/page(?:28913730|52312037)(?:\.html)?/?$ /calculator_of_the_balance_of_counter_obligations_in_leasing/;
    ~^/page(?:26282755|71399481)(?:\.html)?/?$ /soglashenie/;
    ~^/page(?:51367697|51393797)(?:\.html)?/?$ /offer_for_lawyer_20231103/;
    ~^/page(?:32094556|42256391|72322851)(?:\.html)?/?$ /judicial_protection/;
    ~^/page(?:28839647|28899924|28913374|28913661|28913783|32130136|34002752|38421478|39986837|40006646|42256392|42559869|42568746|42581894)(?:\.html)?/?$ /leasing_lawyer/;
    ~^/page28913077(?:\.html)?/?$ /reduction_of_the_penalty_amount/;
    ~^/page32108102(?:\.html)?/?$ /termination_and_restoration_of_contracts/;
    ~^/page42619553(?:\.html)?/?$ /contract_drafting_service/;
    ~^/page70339317(?:\.html)?/?$ /mission/;
    ~^/page71547351(?:\.html)?/?$ /appeal_of_judicial_acts/;
    ~^/page71768123(?:\.html)?/?$ /accident_lawyer/;
    ~^/page72120157(?:\.html)?/?$ /drafting_an_agreement/;
    ~^/page72121483(?:\.html)?/?$ /restoring_the_contract/;
    ~^/page72182793(?:\.html)?/?$ /refund_of_the_penalty/;
    ~^/page72325873(?:\.html)?/?$ /trial_lawyer/;
    ~^/page72336661(?:\.html)?/?$ /contacts/;
    ~^/page73561679(?:\.html)?/?$ /our_team/;
    ~^/page83085476(?:\.html)?/?$ /calc_nst/;

    # Retired Tilda store cards. Match on immutable product ID so both old
    # store prefixes and every historical title slug resolve consistently.
    ~^/tproduct/(?:1-|714506532-)(?:252179145241|282077604281|610212656011|694895456501|813864539801|875253244141|981327299071|983593199461|999861585921)(?:-[^/]*)?/?$ /leasing_lawyer/;
    ~^/tproduct/(?:1-|714506532-)(?:275048119831|388284106071|491875273081|704679785191|910065489431)(?:-[^/]*)?/?$ /appeal_of_judicial_acts/;
    ~^/tproduct/(?:1-|714506532-)320176510031(?:-[^/]*)?/?$ /reduction_of_the_penalty_amount/;
    ~^/tproduct/(?:1-|714506532-)(?:357759448291|372968779041|890490591631)(?:-[^/]*)?/?$ /representation_in_the_arbitration_court/;
    ~^/tproduct/(?:1-|714506532-)(?:388195545401|460283114341)(?:-[^/]*)?/?$ /contract_modification/;
    ~^/tproduct/(?:1-|714506532-)394914343171(?:-[^/]*)?/?$ /contacts/;
    ~^/tproduct/(?:1-|714506532-)(?:582160597101|659279141431|861698759301|958402877971)(?:-[^/]*)?/?$ /property_law/;
    ~^/tproduct/(?:1-|714506532-)(?:549169112501|919764097821|985331995091)(?:-[^/]*)?/?$ /termination_of_the_lease_agreement/;
    ~^/tproduct/(?:1-|714506532-)845587898301(?:-[^/]*)?/?$ /judicial_protection/;
    ~^/tproduct/(?:1-|714506532-)853123503681(?:-[^/]*)?/?$ /collect_the_debt/;

    # Explicit exported-page aliases. Do not use a generic .html location here:
    # nginx internally resolves directory indexes as index.html, so a broad
    # matcher can intercept valid canonical pages.
    ~^/(?<elegso_html_slug>(?:accident_lawyer|appeal_of_judicial_acts|arbitration_lawyer|calc_nst|calculator_of_the_balance_of_counter_obligations_in_leasing|cancellation_of_the_court_order|collect_the_debt|contacts|contract_drafting_service|contract_modification|drafting_an_agreement|judicial_protection|leasing_lawyer|mission|offer_for_lawyer_20231103|our_team|property_law|reduction_of_the_penalty_amount|refund_of_the_penalty|representation_in_the_arbitration_court|restoring_the_contract|soglashenie|termination_and_restoration_of_contracts|termination_of_the_lease_agreement|trial_lawyer))\.html/?$ /$elegso_html_slug/;
    ~^/calc_nst/instruction\.html/?$ /calc_nst/instruction/;

}

server {
    listen 80;
    listen [::]:80;
    server_name elegso.ru www.elegso.ru;

    root /srv/www/elegso.ru/current/www;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/elegso.access.log;
    error_log  /var/log/nginx/elegso.error.log;

    server_tokens off;
    etag on;
    # TLS terminates on the edge proxy. Keep nginx-generated directory
    # redirects relative so an HTTPS request never gets downgraded to HTTP.
    absolute_redirect off;

    set $elegso_robots "index, follow, max-image-preview:large";
    if ($uri ~ ^/(?:api|calculator-data|header|footer|error404)(?:/|$)) {
        set $elegso_robots "noindex, nofollow, noarchive";
    }
    if ($uri ~ ^/calc_nst/service(?:/|$)) {
        set $elegso_robots "noindex, nofollow, noarchive";
    }
    if ($uri ~ ^/page(?:28912341|28912345|32088114|52312037)\.html$) {
        set $elegso_robots "noindex, nofollow, noarchive";
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header X-Robots-Tag $elegso_robots always;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;

    # nginx merges repeated path slashes internally. Redirect the raw form so
    # it cannot become another 200 URL for the same document. Query-string
    # values such as "https://" are deliberately excluded from this test.
    if ($request_uri ~ "^[^?]*//") {
        return 301 https://elegso.ru$uri$is_args$args;
    }

    if ($elegso_legacy_target != "") {
        return 301 https://elegso.ru$elegso_legacy_target$is_args$args;
    }

    if ($host = www.elegso.ru) {
        return 301 https://elegso.ru$request_uri;
    }

    if ($request_uri ~ ^(?<clean_path>/.+)/index\.html(?:\?.*)?$) {
        return 301 https://elegso.ru$clean_path/;
    }

    # Keep one public URL for every HTML document. The sitemap and canonical
    # tags use directory URLs with a trailing slash.
    location = /index.html {
        return 301 https://elegso.ru/;
    }

    location ~ ^/Возврат\x20неустойки/?$ {
        return 301 https://elegso.ru/refund_of_the_penalty/;
    }

    # A Yandex surface emitted tracking data after "&" without a preceding
    # question mark, turning it into a broken path rather than a query string.
    location ~ ^/leasing_lawyer& {
        return 301 https://elegso.ru/leasing_lawyer/;
    }

    location ~ ^/cancellation_of_the_court_order& {
        return 301 https://elegso.ru/cancellation_of_the_court_order/;
    }

    location = /robots.txt {
        default_type text/plain;
        try_files /robots.production.txt =404;
    }

    location = /favicon.ico {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files /_external/static.tildacdn.com/tild3736-6165-4439-a232-616538323231/favicon_1.ico =404;
        access_log off;
    }

    location = /sitemap.xml {
        default_type application/xml;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files /sitemap.xml =404;
    }

    location ~ ^/(?:sitemap_index|sitemap-index|sitemap-feeds|sitemap-feed-944414567261)\.xml$ {
        return 301 https://elegso.ru/sitemap.xml;
    }

    # The mirrored Tilda feed is JSON stored in an index.html file. Serve the
    # representation with its real media type while keeping it out of search.
    location = /api/getfeed/ {
        types { }
        default_type application/json;
        try_files /api/getfeed/index.html =404;
    }

    location /api/calc/ {
        client_max_body_size 2m;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:8783/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /calculator-data/ {
        client_max_body_size 2m;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:8783/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Keep the calculator service under the calculator page. Privacy filters
    # sometimes block generic API-looking paths before they reach nginx.
    location /calc_nst/service/ {
        client_max_body_size 2m;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:8783/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Private marketing dashboard. It is deliberately absent from public
    # navigation, robots.txt and the sitemap. nginx authenticates every asset
    # and API request; the loopback application additionally enforces roles.
    location = /admin {
        return 308 https://elegso.ru/admin/;
    }

    location ^~ /admin/ {
        limit_req zone=elegso_admin_global burst=20 nodelay;
        limit_req_status 429;

        auth_basic "ELEGSO — закрытая аналитика";
        auth_basic_user_file /var/lib/elegso-seo-admin/auth/users.htpasswd;

        client_max_body_size 512k;
        proxy_pass http://unix:/run/elegso-seo-admin/admin.sock:/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Admin-User $remote_user;
        proxy_set_header Authorization "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";

        # Do not put authenticated e-mail usernames into the regular site log.
        access_log off;

        add_header Cache-Control "no-store, max-age=0" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'" always;
    }

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|webp|avif|svg|ico|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
        access_log off;
    }

    error_page 404 /error404/index.html;
}
